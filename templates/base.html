<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Convivy{% endblock %}</title>
  <meta name="description" content="{% block description %}Convivy is an agentic software engineering lab operated by Jay Porter.{% endblock %}">
  <link rel="stylesheet" href="{{ root }}static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ root }}">Convivy</a>
    <nav class="site-nav">
      <a href="{{ root }}fieldnotes/">Field Notes</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>&copy; {{ year }} Convivy</p>
  </footer>
</body>
</html>
