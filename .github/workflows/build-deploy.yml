name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [fieldnotes-changed]
  workflow_dispatch: {}
  schedule:
    # Daily fallback so a missed repository_dispatch (or a stale corpus
    # cache upstream) still catches up within a day.
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false  # per GitHub's Pages template — never kill a deployment mid-flight

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch the Field Notes corpus branch
        id: corpus
        # Orient pushes the published corpus to the orphan branch
        # `fieldnotes-corpus`, which holds corpus.json and nothing else. It
        # carries no .github directory, and the `push` trigger above names
        # only main, so a push there runs no workflow. A dispatch names the
        # commit Orient pushed; that commit is used only when it is on the
        # branch, so a dispatch cannot pick corpus.json out of any other
        # commit. This branch is the production build's only corpus source
        # — a missing branch fails this step rather than falling back to
        # anything, since there is no fallback source left to build from.
        env:
          CORPUS_SHA: ${{ github.event.client_payload.corpus_sha }}
        run: |
          if ! git fetch --quiet --no-tags origin +refs/heads/fieldnotes-corpus:refs/remotes/origin/fieldnotes-corpus; then
            echo "::error::fieldnotes-corpus branch not found; the production build has no corpus source without it"
            exit 1
          fi
          ref=refs/remotes/origin/fieldnotes-corpus
          if [[ "$CORPUS_SHA" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$CORPUS_SHA" "$ref" 2>/dev/null; then
            ref="$CORPUS_SHA"
          elif [ -n "$CORPUS_SHA" ]; then
            echo "::warning::dispatch corpus_sha is not a commit on fieldnotes-corpus; using the branch head"
          fi
          git show "$ref:corpus.json" > "$RUNNER_TEMP/corpus.json"
          echo "file=$RUNNER_TEMP/corpus.json" >> "$GITHUB_OUTPUT"
          echo "Field Notes corpus: fieldnotes-corpus at $(git rev-parse "$ref")"

      - name: Build site
        env:
          # Set by the step above from the fieldnotes-corpus branch — the
          # build's only corpus source.
          FIELDNOTES_CORPUS_FILE: ${{ steps.corpus.outputs.file }}
          # A branch corpus with zero posts fails the build unless this repo
          # variable is "1", set only to unpublish everything on purpose.
          FIELDNOTES_ALLOW_EMPTY: ${{ vars.FIELDNOTES_ALLOW_EMPTY }}
        run: python build/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Scoped down from the workflow-level block (job permissions replace,
    # not merge, the top-level ones): this job doesn't deploy via
    # actions/deploy-pages, so it drops pages/id-token, and it needs
    # pull-requests: write to post the preview-URL comment below.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site (no Orient env vars)
        # No ORIENT_FIELDNOTES_URL / CF_ACCESS_* here on purpose: a PR
        # build never needs secrets, so a fork PR is safe to build this
        # way — there is nothing sensitive in this job's environment for
        # a malicious PR to exfiltrate. The build just renders the
        # empty-state Field Notes index, same as any unconfigured build.
        run: python build/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
          retention-days: 7

      - name: Check for preview deploy token
        id: check_token
        # A fork PR runs with no secrets, so PREVIEW_DEPLOY_TOKEN is empty
        # for it — that's expected, not an error. Same thing applies before
        # Jay has minted and added the token at all. Either way: skip the
        # live deploy and comment steps below, log why, and let the job
        # succeed (the artifact upload above already ran as a fallback).
        env:
          HAS_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "PREVIEW_DEPLOY_TOKEN is not set — skipping live preview deploy (expected for fork PRs, and until Jay adds the secret)."
          fi

      - name: Deploy to www-preview (gh-pages)
        if: steps.check_token.outputs.has_token == 'true'
        env:
          PREVIEW_DEPLOY_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
        # Force-push _site/ as a fresh commit onto www-preview's gh-pages
        # branch — last PR to build wins, there's no per-PR history to
        # preserve. The CNAME file doesn't survive the build, so it's
        # re-written here before the push. The token goes in the remote
        # URL rather than a Basic auth header: GitHub's git-over-HTTP
        # wants Basic, not the Bearer scheme this used to send (which
        # git can't use — it falls through to an interactive credential
        # prompt and dies on a runner with no TTY), and a base64-encoded
        # Basic header risks GNU base64's 76-column wrap splitting a
        # long token across lines. This checkout is a fresh, ephemeral
        # `_site/` tree discarded at the end of the job, so a
        # URL-embedded credential here doesn't linger anywhere.
        run: |
          echo "preview.convivy.com" > _site/CNAME
          cd _site
          git init -q -b gh-pages
          git config user.name "convivy-www-preview-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "preview: convivy/www PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"
          git remote add origin https://x-access-token:${PREVIEW_DEPLOY_TOKEN}@github.com/convivy/www-preview.git
          git push --force origin gh-pages:gh-pages

      - name: Comment preview URL on PR
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- www-preview-url-comment -->';
            const prNumber = context.issue.number;
            const sha = context.payload.pull_request.head.sha;
            const body = [
              marker,
              '**Live preview:** https://preview.convivy.com',
              '',
              `Built from PR #${prNumber} @ \`${sha.substring(0, 7)}\`.`,
              '',
              '_This is one shared preview, not one per PR — whichever PR builds last is what you see. If it looks stale, check whether a newer PR build has landed since._',
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.data.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
